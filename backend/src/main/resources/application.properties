server.port=8080

# Application configuration
spring.application.name=the-ick-list-backend

# AWS configuration
aws.region=${AWS_REGION:us-east-1}
aws.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
aws.ses.sender=${SES_SENDER_EMAIL:noreply@theicklist.app}
aws.ses.enabled=${AWS_SES_ENABLED:false}
aws.bedrock.enabled=${AWS_BEDROCK_ENABLED:false}
aws.bedrock.model-id=${BEDROCK_MODEL_ID:amazon.nova-lite-v1:0}

# JWT configuration
jwt.secret=${JWT_SECRET:icklist-hackathon-super-secret-key-32-chars-long-2026!}
jwt.expiration-ms=86400000

# File Upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.icklist=INFO
logging.level.org.springframework.web=INFO
